<svg viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="prosoftX">
  <title>prosoftX</title>
  <style>
    :root{
      --ink:#1E3A5F;
      --deep:#15293F;
      --flash:#FFFFFF;
      --ease:cubic-bezier(.2,.8,.2,1);
    }
    .ltr{ fill:var(--ink); transform-box:fill-box; transform-origin:center; }
    #letter-x{ fill:var(--deep); transform-box:fill-box; transform-origin:center; }
    #x-flash{ fill:var(--flash); opacity:0; transform-box:fill-box; transform-origin:center; }
    #load-flash{ fill:var(--flash); opacity:0; }

    #letter-p{ --dx:14px; }
    #letter-r{ --dx:10px; }
    #letter-o1{ --dx:6px; }
    #letter-s{ --dx:2px; }
    #letter-o2{ --dx:-2px; }
    #letter-f{ --dx:-6px; }
    #letter-t{ --dx:-9px; }

    /* ---- ON LOAD : lightning strike, left to right ---- */
    @keyframes strike{
      from{ clip-path:inset(0 100% 0 0); }
      to  { clip-path:inset(0 0 0 0); }
    }
    #letters{ animation:strike .8s var(--ease) both; }

    @keyframes loadFlash{
      0%{ opacity:0; } 82%{ opacity:0; }
      90%{ opacity:.7; } 100%{ opacity:0; }
    }
    #load-flash{ animation:loadFlash .8s var(--ease) both; }

    /* X is the protagonist: resolves last with a strong micro-flash */
    @keyframes xpop{
      0%{ transform:scale(.9) rotate(39deg); opacity:0; }
      55%{ transform:scale(1.1) rotate(47deg); opacity:1; }
      100%{ transform:scale(1) rotate(45deg); opacity:1; }
    }
    #letter-x{ animation:xpop .26s var(--ease) .62s both; }

    /* ---- ON HOVER : close and open ---- */
    @keyframes closeOpen{
      0%{ transform:translateX(0); opacity:1; }
      40%{ transform:translateX(var(--dx)); opacity:.85; }
      70%{ transform:translateX(calc(var(--dx) * -0.15)); opacity:1; }
      100%{ transform:translateX(0); opacity:1; }
    }
    svg:hover .ltr{ animation:closeOpen .5s var(--ease); }

    @keyframes xCloseOpen{
      0%{ transform:translateX(0) rotate(45deg) scaleX(1); }
      40%{ transform:translateX(-9px) rotate(53deg) scaleX(.84); }
      70%{ transform:translateX(2px) rotate(42deg) scaleX(1.05); }
      100%{ transform:translateX(0) rotate(45deg) scaleX(1); }
    }
    svg:hover #letter-x{ animation:xCloseOpen .5s var(--ease); }

    @keyframes xFlash{
      0%{ opacity:0; } 55%{ opacity:0; }
      72%{ opacity:.6; } 88%{ opacity:0; } 100%{ opacity:0; }
    }
    svg:hover #x-flash{ animation:xFlash .5s linear; }

    @media (prefers-reduced-motion: reduce){
      #letters,.ltr,#letter-x,#x-flash,#load-flash{
        animation:none !important; transition:none !important;
        clip-path:none !important; opacity:1 !important; transform:none !important;
      }
      #x-flash,#load-flash{ opacity:0 !important; }
    }
  </style>

